name: Upstream Sync

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *" # every day
    workflow_dispatch:

jobs:
    sync_latest_from_upstream:
        name: Sync latest commits from upstream repo
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            # Step 1: run a standard checkout action
            - name: Checkout target repo
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            # Step 2: run the sync action
            - name: Sync upstream changes
              id: sync
              uses: aormsby/Fork-Sync-With-Upstream-action@83d78e8c4bf524e79b091cf257deba4dee9e60df # v3.4.3
              with:
                  upstream_sync_repo: free5394/cf-yx-dns
                  upstream_sync_branch: main
                  target_sync_branch: main
                  target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set

                  # Set test_mode true to run tests instead of the true action!!
                  test_mode: false

            - name: Sync check
              if: failure()
              run: |
                  echo "[Error] 由于上游仓库的 workflow 文件变更，导致 GitHub 自动暂停了本次自动更新，你需要手动 Sync Fork 一次。"
                  exit 1
