name: "dns_cf_push"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    schedule:
        - cron: "23 */6 * * *"
    workflow_dispatch:

# 并发边界：group 是固定字符串，跟触发方式无关，所以本工作流的定时（schedule）与手动
# （workflow_dispatch）两类触发共用同一个队列，同一时刻只会有一轮同步在跑；正在跑的那轮
# 不会被取消，后来的排队等待。范围仅限这两类触发——别的 workflow 不在保护内，
# 本地手动运行也不受约束，见 docs/adr/0003-concurrency-boundary.md。
concurrency:
    group: dns_cf_push
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        # 兜底：挂住的运行会一直占着上面那个 group，而同组只保留一个 pending 运行，
        # 后续触发会互相顶掉，表现为「定时任务悄悄不再执行」。超时强制释放。
        timeout-minutes: 15
        permissions:
            contents: read
            actions: write

        steps:
            - name: "Checkout"
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: 安装 uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

            - name: 安装项目
              run: uv sync --locked --dev

            - name: "run dnscf"
              env:
                  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
                  CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
                  CF_DNS_NAME: ${{ secrets.CF_DNS_NAME }}
                  CF_YX_URL: ${{ secrets.CF_YX_URL }}
                  PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
              run: uv run src/dnscf.py

            - name: 失败时推送告警
              if: failure()
              env:
                  PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
                  CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
                  CF_DNS_NAME: ${{ secrets.CF_DNS_NAME }}
              # --no-sync：跳过 uv run 自带的环境同步——uv sync 本身失败（如锁文件不匹配）时，
              # 失败分支若再走一遍同步只会同样失败，告警永远发不出去（告警自举）
              run: uv run --no-sync src/dnscf.py --notify-failure "DNS 更新任务执行失败，请检查 Actions 日志"

            - name: Delete old workflow runs
              uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  retain_days: 7
                  keep_minimum_runs: 1
