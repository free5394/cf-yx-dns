name: "dns_cf_push"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
    schedule:
        - cron: "23 */6 * * *"
    workflow_dispatch:

# 定时任务与手动触发可能重叠；排队执行而不是并发，避免两轮同步互相踩到差量计算
concurrency:
    group: dns_cf_push
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            actions: write

        steps:
            - name: "Checkout"
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: 安装 uv
              uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

            - name: 安装项目
              run: uv sync --locked --dev

            - name: "run dnscf"
              env:
                  CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
                  CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
                  CF_DNS_NAME: ${{ secrets.CF_DNS_NAME }}
                  CF_YX_URL: ${{ secrets.CF_YX_URL }}
                  PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
              run: uv run src/dnscf.py

            - name: 失败时推送告警
              if: failure()
              env:
                  PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
                  CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
                  CF_DNS_NAME: ${{ secrets.CF_DNS_NAME }}
              run: uv run src/dnscf.py --notify-failure "DNS 更新任务执行失败，请检查 Actions 日志"

            - name: Delete old workflow runs
              uses: Mattraks/delete-workflow-runs@0cf693bc9909e5e867ee8f27b813224ba862939c # v2
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  retain_days: 7
                  keep_minimum_runs: 1
