[project]
name = "cf-yx-dns"
version = "0.1.0"
description = "Cloudflare DNS 优选 IP 自动更新dns工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cloudflare>=5.1.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
