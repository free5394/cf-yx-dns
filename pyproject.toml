[project]
name = "cf-yx-dns"
version = "0.1.0"
description = "Cloudflare DNS 优选 IP 自动更新dns工具"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "free5394" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "cloudflare>=5.1.0",
    "httpx>=0.27",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = ["pytest>=8.4"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
